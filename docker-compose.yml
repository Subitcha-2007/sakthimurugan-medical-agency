version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sakthimurugan_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/sakthimurugan_db
      - JWT_SECRET=sakthimurugan_production_secret_2026
    depends_on:
      - mongo

  mongo:
    image: mongo:7-jammy
    container_name: sakthimurugan_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
